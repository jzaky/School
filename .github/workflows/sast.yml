name: SAST

# Static analysis of the whole repository (the school app, AEGIS, scripts and workflows) on every push, every pull
# request and weekly. No path filters: a required check that is skipped would look like a pass.
# Dependency and container scanning stay in aegis-ci.yml (pnpm audit, Trivy); secrets stay with Gitleaks.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
        include:
          # Reads "codeql[rule-id] reason" comments so a reviewed false positive is marked suppressed in source,
          # next to the code it is about, instead of only in the gate's baseline.
          - language: javascript-typescript
            extra-queries: "+codeql/javascript-queries:AlertSuppression.ql"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: ${{ matrix.extra-queries }}
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: Gate on high and critical findings
        run: node .github/scripts/sast-gate.mjs --baseline .github/sast-baseline.json sarif-results/*.sarif

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Semgrep (pinned)
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0
      - name: Scan
        env:
          SEMGREP_SEND_METRICS: "off"
          # On a pull request only findings the change introduces are reported; elsewhere every finding is.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline=()
          if [ -n "$BASE_SHA" ]; then baseline=(--baseline-commit "$BASE_SHA"); fi
          semgrep scan --metrics off --config p/typescript --config p/javascript --config p/nodejs --config p/react --config p/python --config p/github-actions --severity ERROR --severity WARNING "${baseline[@]}" --sarif --output semgrep.sarif
      - name: Upload to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gate on high and critical findings
        run: node .github/scripts/sast-gate.mjs --baseline .github/sast-baseline.json semgrep.sarif

  gate-tests:
    name: SAST gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The gate refuses missing, empty and failed scans and unreviewed findings
        run: node --test .github/scripts/sast-gate.test.mjs

  # The one check to require in branch protection. It fails unless every scan above ran and passed, so a
  # cancelled, skipped or failed scan can never count as clean.
  sast-gate:
    name: SAST gate
    if: always()
    needs: [codeql, semgrep, gate-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every scan ran and passed
        env:
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          GATE_TESTS: ${{ needs.gate-tests.result }}
        run: |
          echo "codeql=$CODEQL semgrep=$SEMGREP gate-tests=$GATE_TESTS"
          [ "$CODEQL" = "success" ] && [ "$SEMGREP" = "success" ] && [ "$GATE_TESTS" = "success" ]
