name: Video voiceover

# Generates the narration (Kokoro-82M, Apache 2.0) and an original ambient music bed for the
# product video, then commits the MP3 files under media/voiceover.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Narration script (repo path)"
        required: true
        default: "media/voiceover/script.json"
      voice:
        description: "Kokoro voice (empty = the script's voice)"
        required: false
        default: ""
      music_seconds:
        description: "Length of the music bed"
        required: false
        default: "420"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install speech tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy
      - name: Narration
        # Expressions reach the shell as environment variables, never as command text.
        env:
          IN_SCRIPT: ${{ inputs.script }}
          IN_VOICE: ${{ inputs.voice }}
        run: python scripts/media/tts.py --script "${IN_SCRIPT}" --out media/voiceover --voice "${IN_VOICE}"
      - name: Music bed
        # Expressions reach the shell as environment variables, never as command text.
        env:
          IN_MUSIC_SECONDS: ${{ inputs.music_seconds }}
        run: python scripts/media/music.py --seconds "${IN_MUSIC_SECONDS}" --out media/voiceover/music.mp3
      - name: Commit audio
        # Expressions reach the shell as environment variables, never as command text.
        env:
          IN_GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/voiceover
          git commit -m "Video voiceover and music bed" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${IN_GH_REF_NAME}" && git push origin "HEAD:${IN_GH_REF_NAME}" && break
            sleep $((i * 5))
          done
