name: Video voiceover

# Generates the narration (Kokoro-82M, Apache 2.0) and an original ambient music bed for the
# product video, then commits the MP3 files under media/voiceover.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Narration script (repo path)"
        required: true
        default: "media/voiceover/script.json"
      voice:
        description: "Kokoro voice (empty = the script's voice)"
        required: false
        default: ""
      music_seconds:
        description: "Length of the music bed (0 = keep the existing music)"
        required: false
        default: "420"
      out:
        description: "Output folder (repo path)"
        required: false
        default: "media/voiceover"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install speech tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy
          # spaCy 3.8.16 breaks the English model used by Kokoro (OverflowError); pin the last working set.
          pip install -q "spacy==3.8.7" "preshed==3.0.10" "cymem==2.0.11" "murmurhash==1.0.13" "thinc==8.3.6" "srsly==2.5.1" "blis==1.3.0"
      - name: Narration
        run: python scripts/media/tts.py --script "${{ inputs.script }}" --out "${{ inputs.out }}" --voice "${{ inputs.voice }}"
      - name: Music bed
        if: ${{ inputs.music_seconds != '0' }}
        run: python scripts/media/music.py --seconds "${{ inputs.music_seconds }}" --out media/voiceover/music.mp3
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/voiceover "${{ inputs.out }}"
          git commit -m "Video voiceover and music bed" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep $((i * 5))
          done
