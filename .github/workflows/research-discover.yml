name: Research page discovery

# Reads each university's own sitemap and lists candidate official pages (URLs only, no page text)
# for the entry requirements research. Output is committed under research/candidates/<label>.json.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Universities and domains (repo path)"
        required: true
        default: "research/discover-list.json"
      label:
        description: "Output file name under research/candidates"
        required: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read sitemaps
        run: node scripts/research/discover.mjs --list "${{ inputs.list }}" --out "research/candidates/${{ inputs.label }}.json"
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidates
          git commit -m "Research discovery ${{ inputs.label }}: candidate official pages" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep $((i * 5))
          done
