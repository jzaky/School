# Local or single-host deployment. Copy ../.env.example to ../.env and fill the secrets first.
#   docker compose -f deploy/docker-compose.yml up --build
#
# Credential boundaries:
# - Only the one-shot `migrate` service receives MIGRATION_DATABASE_URL (table owner). The api, worker
#   and web services connect as the non-owner `aegis_app` role and have the owner URL overridden to
#   empty so a value in ../.env cannot leak into them. Each service refuses to start in production if
#   it finds an owner URL anyway (see packages/core/src/process-guard.ts).
# - Uploaded documents live on the shared `uploads` volume mounted into api, web and worker at
#   /data/uploads (AEGIS_STORAGE_DIR). Without it, uploads would be written to the container
#   filesystem and lost on restart, and the web and api containers would not see each other's files.
name: aegis
x-app-env: &app-env
  DATABASE_URL: postgresql://aegis_app:${POSTGRES_APP_PASSWORD:-aegis_app_dev}@postgres:5432/aegis
  MIGRATION_DATABASE_URL: ""
  AEGIS_APP_PASSWORD: ""
  REDIS_URL: redis://redis:6379
  AEGIS_STORAGE_DIR: /data/uploads
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-aegis_owner_dev}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_owner -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: migrate }
    env_file: ../.env
    environment:
      MIGRATION_DATABASE_URL: postgresql://aegis_owner:${POSTGRES_OWNER_PASSWORD:-aegis_owner_dev}@postgres:5432/aegis
      DATABASE_URL: postgresql://aegis_app:${POSTGRES_APP_PASSWORD:-aegis_app_dev}@postgres:5432/aegis
      AEGIS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-aegis_app_dev}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  # One-off: seeds the synthetic demo tenant. Run after migrate:  docker compose -f deploy/docker-compose.yml --profile seed run --rm seed
  # The demo agent API keys and the platform admin password are written to deploy/seed-output/.demo-keys.json
  # on the host (mode 600). Keep that file private; delete it once you have what you need.
  seed:
    build: { context: .., dockerfile: deploy/Dockerfile, target: migrate }
    env_file: ../.env
    environment:
      MIGRATION_DATABASE_URL: postgresql://aegis_owner:${POSTGRES_OWNER_PASSWORD:-aegis_owner_dev}@postgres:5432/aegis
      DATABASE_URL: postgresql://aegis_app:${POSTGRES_APP_PASSWORD:-aegis_app_dev}@postgres:5432/aegis
      AEGIS_PROCESS: script
      AEGIS_DEMO_KEYS_FILE: /out/.demo-keys.json
    volumes:
      - ./seed-output:/out
    command: ["pnpm", "--filter", "@aegis/core", "seed"]
    profiles: ["seed"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    env_file: ../.env
    environment:
      <<: *app-env
      AEGIS_PROCESS: api
    volumes:
      - uploads:/data/uploads
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    env_file: ../.env
    environment:
      <<: *app-env
      AEGIS_PROCESS: worker
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    env_file: ../.env
    environment:
      <<: *app-env
      AEGIS_PROCESS: web
      API_PUBLIC_URL: http://api:4000
    volumes:
      - uploads:/data/uploads
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  pgdata: {}
  uploads: {}
