apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  namespace: aegis
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [console.aegis.example.com, api.aegis.example.com]
      secretName: aegis-tls
  rules:
    - host: console.aegis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: aegis-web, port: { number: 3000 } } }
    - host: api.aegis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: aegis-api, port: { number: 4000 } } }
