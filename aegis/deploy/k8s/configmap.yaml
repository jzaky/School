apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
data:
  NODE_ENV: production
  LOG_LEVEL: info
  API_PORT: "4000"
  API_PUBLIC_URL: https://api.aegis.example.com
  WEB_PUBLIC_URL: https://console.aegis.example.com
  API_CORS_ORIGINS: https://console.aegis.example.com
  AEGIS_DEMO_MODE: "false"
  AEGIS_STORAGE_DIR: /data/uploads
  OTEL_SERVICE_NAME: aegis
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
