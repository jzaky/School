# Copy to secrets.yaml, fill in, never commit. Generate keys with: pnpm --filter @aegis/core keygen
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL: postgresql://aegis_app:CHANGE_ME@postgres:5432/aegis
  MIGRATION_DATABASE_URL: postgresql://aegis_owner:CHANGE_ME@postgres:5432/aegis
  AEGIS_APP_PASSWORD: CHANGE_ME
  REDIS_URL: redis://redis:6379
  AEGIS_MASTER_KEY: CHANGE_ME_BASE64_32_BYTES
  AEGIS_SESSION_SECRET: CHANGE_ME_BASE64_32_BYTES
  EVIDENCE_SIGNING_KEY: CHANGE_ME_BASE64_PKCS8_ED25519
