# Copy to secrets.yaml, fill in, never commit. Generate keys with: pnpm --filter @aegis/core keygen
#
# Two secrets on purpose. `aegis-secrets` goes to the api, web and worker pods and carries only the
# non-owner application role. `aegis-migrate-secrets` carries the table-owner URL and is mounted
# only by the migration Job. Application pods refuse to start in production if they find
# MIGRATION_DATABASE_URL in their environment.
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL: postgresql://aegis_app:CHANGE_ME@postgres:5432/aegis
  REDIS_URL: redis://redis:6379
  AEGIS_MASTER_KEY: CHANGE_ME_BASE64_32_BYTES
  AEGIS_SESSION_SECRET: CHANGE_ME_BASE64_32_BYTES
  EVIDENCE_SIGNING_KEY: CHANGE_ME_BASE64_PKCS8_ED25519
  # Retired public keys after a rotation (base64 SPKI PEM, comma separated); empty until the first rotation.
  EVIDENCE_VERIFY_KEYS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-migrate-secrets
  namespace: aegis
type: Opaque
stringData:
  MIGRATION_DATABASE_URL: postgresql://aegis_owner:CHANGE_ME@postgres:5432/aegis
  DATABASE_URL: postgresql://aegis_app:CHANGE_ME@postgres:5432/aegis
  AEGIS_APP_PASSWORD: CHANGE_ME
  AEGIS_MASTER_KEY: CHANGE_ME_BASE64_32_BYTES
  AEGIS_SESSION_SECRET: CHANGE_ME_BASE64_32_BYTES
