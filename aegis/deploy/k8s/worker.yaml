apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-worker
  namespace: aegis
  labels: { app: aegis-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aegis-worker }
  template:
    metadata:
      labels: { app: aegis-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/example/aegis-worker:latest
          envFrom:
            - configMapRef: { name: aegis-config }
            - secretRef: { name: aegis-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }


