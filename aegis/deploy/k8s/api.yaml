apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis
  labels: { app: aegis-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aegis-api }
  template:
    metadata:
      labels: { app: aegis-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/example/aegis-api:latest
          envFrom:
            - configMapRef: { name: aegis-config }
            - secretRef: { name: aegis-secrets }
          env:
            - { name: AEGIS_PROCESS, value: api }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet: { path: /ready, port: 4000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 30
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: aegis-uploads }
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-api
  namespace: aegis
spec:
  selector: { app: aegis-api }
  ports:
    - port: 4000
      targetPort: 4000
